services:
    postgres:
        image: postgres:17
        container_name: meetinglens-postgres
        restart: unless-stopped

        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: meetinglens

        ports:
            - '5432:5432'

        volumes:
            - postgres-data:/var/lib/postgresql/data

    redis:
        image: redis:8-alpine
        container_name: meetinglens-redis
        restart: unless-stopped

        ports:
            - '6379:6379'

        volumes:
            - redis-data:/data

    minio:
        image: minio/minio:latest
        container_name: meetinglens-minio
        restart: unless-stopped

        command: server /data --console-address ":9001"

        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin

        ports:
            - '9000:9000'
            - '9001:9001'

        volumes:
            - minio-data:/data

volumes:
    postgres-data:
    redis-data:
    minio-data:
